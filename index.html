  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Suppress and gracefully handle Vite HMR WebSockets in preview environment
        try {
          var NativeWebSocket = window.WebSocket;
          if (NativeWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                var target = new EventTarget();
                var mock = {
                  readyState: 1,
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  send: function() {},
                  close: function() {},
                  addEventListener: target.addEventListener.bind(target),
                  removeEventListener: target.removeEventListener.bind(target),
                  dispatchEvent: target.dispatchEvent.bind(target)
                };
                setTimeout(function() {
                  var openEvent = new Event('open');
                  target.dispatchEvent(openEvent);
                  if (typeof mock.onopen === 'function') mock.onopen(openEvent);
                }, 10);
                return mock;
              }
              return new NativeWebSocket(url, protocols);
            };
            window.WebSocket.prototype = NativeWebSocket.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
        } catch (e) {}

        window.addEventListener('unhandledrejection', function(event) {
          var msg = '' + (event && event.reason && (event.reason.message || event.reason) || '');
          var stack = '' + (event && event.reason && event.reason.stack || '');
          if (msg.indexOf('WebSocket') !== -1 || stack.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = '' + (event && event.message || '');
          var filename = '' + (event && event.filename || '');
          if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
