name: DXF import scale regression

on:
  push:
    branches:
      - upgrade/review-and-improvements
    paths:
      - 'src/services/customDielineEngine.ts'
      - 'scripts/verify-dxf-scale-warning.ts'
      - '.github/workflows/dxf-scale-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dxf-scale-regression:
    name: DXF source-scale disclosure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Verify imported DXF keeps source coordinates and warns users
        run: bun scripts/verify-dxf-scale-warning.ts
