name: Build and preview full Ashk Ghalam site
on:
  push:
    branches:
      - upgrade/review-and-improvements
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-preview
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Run dieline geometry regression checks
        run: bun scripts/verify-dieline-engines.ts
      - name: Build the actual React/Vite application
        run: bunx vite build --base=/ashkghalamsite-1405-7/
      - name: Prepare static Pages output and SPA fallback
        run: |
          test -f dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Upload full site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
